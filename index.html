<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LifeQuest — Карта недели</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --cream: #FDF7DE;
    --blue: #93ABD8;
    --blue-deep: #4E6491;
    --pink: #F3619C;
    --pink-deep: #B23C6C;
    --yellow: #EDE986;
    --yellow-deep: #9C9740;
    --lav: #E7BEF8;
    --lav-deep: #8A5AA3;
    --red: #FB4645;
    --red-deep: #A82A29;
    --paleyellow: #F8EDAD;
    --orange: #ED7C30;
    --orange-deep: #A2531D;
    --purple: #B494F8;
    --purple-deep: #6B4B9E;
    --lime: #DBFA40;
    --lime-deep: #7C9414;
    --ink: #2C2A22;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--cream);
    color: var(--ink);
    font-family: 'Nunito', -apple-system, sans-serif;
    padding: 24px 16px 44px;
  }

  .stage{ max-width: 440px; margin:0 auto; }

  .top{ text-align:center; position: relative; margin-bottom: 22px; }
  .brand{
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px;
    color: var(--pink-deep); letter-spacing: 0.02em;
  }
  h1{
    font-family: 'Unbounded', sans-serif; font-weight: 800;
    font-size: 30px; line-height: 1.08; color: var(--blue-deep);
    margin: 6px 0 2px;
  }
  .range{ font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13.5px; color: #8A8365; }

  .blob{
    position: relative; flex-shrink: 0;
    display: flex; align-items:center; justify-content:center;
  }
  .blob svg{ width:100%; height:100%; overflow: visible; }

  .top .corner-blob{ position:absolute; top:-10px; }
  .top .corner-blob.left{ left: 4px; transform: rotate(-8deg); }
  .top .corner-blob.right{ right: 4px; transform: rotate(10deg); }

  .card{
    border-radius: 22px;
    padding: 18px 16px;
    margin-bottom: 14px;
  }
  .card.blue{ background: var(--blue); }
  .card.paleyellow{ background: var(--paleyellow); }
  .card.purple{ background: var(--purple); }

  .card-title{
    font-family:'Unbounded', sans-serif; font-weight: 700; font-size: 15px;
    margin: 0 0 12px; display:flex; align-items:center; gap:8px;
  }
  .card.blue .card-title{ color: var(--blue-deep); }
  .card.paleyellow .card-title{ color: var(--orange-deep); }
  .card.purple .card-title{ color: var(--purple-deep); }

  .grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
  .cell{
    aspect-ratio: 1/1; background: var(--cream);
    border-radius: 14px; padding: 7px 8px; position:relative;
    display:flex; flex-direction: column; transition: background 0.2s;
  }
  .cell-label{
    font-family:'Nunito', sans-serif; font-weight: 800; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--blue-deep); margin-bottom: 3px;
  }
  .cell textarea{
    width:100%; flex:1; border:none; background:transparent; resize:none; outline:none;
    font-family:'Nunito', sans-serif; font-weight: 600; font-size: 11.5px; line-height:1.25;
    color: var(--ink); padding:0;
  }
  .cell textarea::placeholder{ color:#B7AF8E; font-weight: 600; }
  .cell.done{ background: var(--yellow); }
  .cell.done textarea{ color: var(--yellow-deep); text-decoration: line-through; text-decoration-color: rgba(156,151,64,0.6); }
  .cell.done .cell-label{ color: var(--yellow-deep); }

  .cell.center{
    grid-column: 2; grid-row: 2;
    background: var(--pink);
    box-shadow: 0 0 0 3px var(--red);
  }
  .cell.center .cell-label{ color: #fff; }
  .cell.center textarea{ color: #fff; font-weight: 700; }
  .cell.center textarea::placeholder{ color: rgba(255,255,255,0.75); }
  .cell.center.done{ background: var(--lime); box-shadow: 0 0 0 3px var(--lime-deep); }
  .cell.center.done textarea, .cell.center.done .cell-label{ color: var(--lime-deep); }

  .cell-sticker{
    position:absolute; right:-8px; bottom:-8px; width:34px; height:34px;
    transform: scale(0) rotate(-25deg); transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
  }
  .cell.done .cell-sticker{ transform: scale(1) rotate(-12deg); }

  .tap-zone{ position:absolute; right:0; bottom:0; width:42%; height:42%; cursor:pointer; }

  .reward-row{
    display:flex; align-items:center; gap:10px;
    background: var(--cream); border-radius: 14px; padding: 10px 12px;
  }
  .reward-row input{
    flex:1; border:none; background:transparent; outline:none;
    font-family:'Nunito', sans-serif; font-weight:700; font-size:14px; color: var(--ink);
  }
  .reward-row input::placeholder{ color:#B7AF8E; }

  .stars{ display:flex; gap:5px; margin-bottom:6px; flex-wrap:wrap; }
  .star-btn{
    width:24px; height:24px; cursor:pointer;
    background: rgba(255,255,255,0.5);
    clip-path: polygon(50% 0%, 63% 35%, 100% 35%, 70% 57%, 82% 92%, 50% 71%, 18% 92%, 30% 57%, 0% 35%, 37% 35%);
  }
  .star-btn.on{ background: var(--lime); }
  .rating-caption{ font-family:'Nunito', sans-serif; font-weight:700; font-size:12.5px; color: var(--purple-deep); margin-bottom:12px; }

  textarea.notes{
    width:100%; min-height:56px; background: var(--cream); border:none; border-radius:14px;
    padding:10px 12px; font-family:'Nunito', sans-serif; font-weight:600; font-size:13px; color:var(--ink);
    outline:none; resize:vertical; line-height:1.4;
  }
  textarea.notes::placeholder{ color:#B7AF8E; }

  .bingo-banner{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Unbounded', sans-serif; font-weight:700; font-size:14px; color: var(--pink-deep);
    background: var(--pink); border-radius: 16px; padding: 12px; margin: 4px 0 16px;
    color:#fff;
  }
  .bingo-banner:not(.show){ display:none; }

  .save-wrap{ display:flex; justify-content:center; margin-top: 20px; }
  .save-btn{
    font-family:'Unbounded', sans-serif; font-weight:700; font-size:14px;
    color:#fff; background: var(--red);
    border:none; border-radius:999px; padding:15px 34px;
    box-shadow: 0 6px 0 var(--red-deep);
    cursor:pointer;
  }
  .save-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--red-deep); }
  .save-btn.saved{ background: var(--lime); color: var(--lime-deep); box-shadow: 0 6px 0 var(--lime-deep); }

  .status{ text-align:center; font-family:'Nunito',sans-serif; font-weight:700; font-size:12px; color:#8A8365; margin-top:12px; min-height:14px; }
</style>
</head>
<body>

  <div class="stage">
    <div class="top">
      <div class="blob corner-blob left" id="mascotHeaderLeft" style="width:46px;height:46px;"></div>
      <div class="blob corner-blob right" id="mascotHeaderRight" style="width:44px;height:40px;"></div>
      <div class="brand">LifeQuest</div>
      <h1>Карта недели</h1>
      <div class="range" id="weekRange">—</div>
    </div>

    <div class="bingo-banner" id="bingoBanner">🎉 Бинго! Карта закрыта</div>

    <div class="card blue">
      <div class="card-title">
        <div class="blob" id="mascotQuests" style="width:26px;height:22px;"></div>
        Квесты недели
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="card paleyellow">
      <div class="card-title">
        <div class="blob" id="mascotReward" style="width:22px;height:19px;"></div>
        Награда
      </div>
      <div class="reward-row">
        <input type="text" id="reward" maxlength="80" placeholder="Чем наградишь себя за полную карту?">
      </div>
    </div>

    <div class="card purple">
      <div class="card-title">
        <div class="blob" id="mascotResults" style="width:24px;height:21px;"></div>
        Итоги недели
      </div>
      <div class="stars" id="stars"></div>
      <div class="rating-caption" id="ratingCaption">Оцени неделю от 1 до 10</div>
      <textarea class="notes" id="notes" maxlength="300" placeholder="Что не получилось на этой неделе?"></textarea>
    </div>

    <div class="save-wrap">
      <button class="save-btn" id="saveBtn">Сохранить карту</button>
    </div>
    <div class="status" id="status"></div>
  </div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const CELL_COUNT = 9;
  const grid = document.getElementById('grid');
  const bingoBanner = document.getElementById('bingoBanner');
  const rewardInput = document.getElementById('reward');
  const notesInput = document.getElementById('notes');
  const starsEl = document.getElementById('stars');
  const ratingCaption = document.getElementById('ratingCaption');
  const saveBtn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('status');
  const weekRangeEl = document.getElementById('weekRange');

  let state = {
    cells: Array(CELL_COUNT).fill(''),
    done: Array(CELL_COUNT).fill(false),
    reward: '',
    rating: 0,
    notes: '',
    week_range: ''
  };

  // Бот передаёт текущую карту в ссылке: ?board=<base64url от UTF-8 JSON>.
  function decodeBoard(raw) {
    let b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function loadFromQuery() {
    try {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('board');
      if (raw) { state = Object.assign(state, decodeBoard(raw)); }
    } catch (e) {}
    for (let i = 0; i < CELL_COUNT; i++) {
      state.cells[i] = String(state.cells[i] || '');
      state.done[i] = Boolean(state.done[i]);
    }
    state.cells.length = CELL_COUNT;
    state.done.length = CELL_COUNT;
  }
  loadFromQuery();
  weekRangeEl.textContent = state.week_range || '';

  const MASCOT_KINDS = ['star','heart','cat-purple','cat-blue','cat-lav','cat-orange','cat-pink2','cat-lime'];
  const EXPRESSIONS = ['happy','wink','surprised','sleepy','silly'];

  const MASCOT_COLORS = {
    'cat-purple': '#B494F8', 'cat-blue': '#93ABD8', 'cat-lav': '#E7BEF8',
    'cat-orange': '#ED7C30', 'cat-pink2': '#F3619C', 'cat-lime': '#DBFA40'
  };

  function eyesSVG(expr) {
    if (expr === 'wink') {
      return '<circle cx="35" cy="44" r="5" fill="#241F1A"/>'
           + '<path d="M56 44 q9 -7 18 0" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>';
    }
    if (expr === 'sleepy') {
      return '<path d="M27 44 q8 6 16 0" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>'
           + '<path d="M57 44 q8 6 16 0" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>';
    }
    if (expr === 'surprised') {
      return '<circle cx="35" cy="44" r="6.5" fill="#241F1A"/><circle cx="65" cy="44" r="6.5" fill="#241F1A"/>';
    }
    return '<circle cx="35" cy="44" r="5" fill="#241F1A"/><circle cx="65" cy="44" r="5" fill="#241F1A"/>';
  }

  function mouthSVG(expr) {
    if (expr === 'surprised') return '<ellipse cx="50" cy="62" rx="6" ry="7" fill="#241F1A"/>';
    if (expr === 'silly') {
      return '<path d="M38 58 q12 12 24 0" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>'
           + '<path d="M45 61 q5 9 10 0 Z" fill="#E8807A"/>';
    }
    return '<path d="M38 58 q12 9 24 0" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>';
  }

  function mascotSVG(kind, expr) {
    const eyes = eyesSVG(expr);
    const mouth = mouthSVG(expr);
    if (kind === 'star') {
      return '<svg viewBox="0 0 100 100">'
        + '<path d="M50 4 L61 36 L96 36 L67 57 L78 90 L50 70 L22 90 L33 57 L4 36 L39 36 Z" fill="#EDE986"/>'
        + eyes + '<path d="M40 60 q10 7 20 0" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>'
        + '</svg>';
    }
    if (kind === 'heart') {
      return '<svg viewBox="0 0 100 100">'
        + '<path d="M50 88 C10 62 8 30 30 18 C42 12 50 22 50 32 C50 22 58 12 70 18 C92 30 90 62 50 88 Z" fill="#FB4645"/>'
        + eyes + '<path d="M40 50 q10 7 20 0" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>'
        + '</svg>';
    }
    const color = MASCOT_COLORS[kind] || '#B494F8';
    return '<svg viewBox="0 0 100 100">'
      + '<path d="M18 34 L30 6 L42 30 Z" fill="' + color + '"/>'
      + '<path d="M82 34 L70 6 L58 30 Z" fill="' + color + '"/>'
      + '<ellipse cx="50" cy="58" rx="42" ry="36" fill="' + color + '"/>'
      + eyes
      + '<ellipse cx="50" cy="53" rx="3.2" ry="2.4" fill="#241F1A"/>'
      + mouth
      + '</svg>';
  }

  const CELL_THEMES = [
    { label: 'Привычка', placeholder: 'Полезная привычка, которую будешь соблюдать каждый день' },
    { label: 'Новое', placeholder: 'Что-то новое, что попробуешь на этой неделе' },
    { label: 'Тема', placeholder: 'Тема, которую изучишь' },
    { label: 'Тело', placeholder: 'Забота о теле — спорт, сон, здоровье' },
    { label: 'Главное дело', placeholder: 'Самое сложное дело недели', center: true },
    { label: 'Творчество', placeholder: 'Что-то, что ты создашь' },
    { label: 'Смелость', placeholder: 'Шаг, который давно откладываешь' },
    { label: 'Забота', placeholder: 'Приятное для близкого человека' },
    { label: 'Отдых', placeholder: 'То, что вернёт силы' },
  ];

  function stickerHTML() {
    const kind = MASCOT_KINDS[Math.floor(Math.random() * MASCOT_KINDS.length)];
    const expr = EXPRESSIONS[Math.floor(Math.random() * EXPRESSIONS.length)];
    return '<div class="blob" style="width:100%;height:100%;">' + mascotSVG(kind, expr) + '</div>';
  }

  function renderGrid() {
    grid.innerHTML = '';
    for (let i = 0; i < CELL_COUNT; i++) {
      const theme = CELL_THEMES[i];
      const cell = document.createElement('div');
      cell.className = 'cell' + (state.done[i] ? ' done' : '') + (theme.center ? ' center' : '');

      const label = document.createElement('div');
      label.className = 'cell-label';
      label.textContent = theme.label;
      cell.appendChild(label);

      const ta = document.createElement('textarea');
      ta.placeholder = theme.placeholder;
      ta.value = state.cells[i] || '';
      ta.rows = theme.center ? 4 : 3;
      ta.maxLength = 80;
      ta.addEventListener('input', () => { state.cells[i] = ta.value; markUnsaved(); });
      cell.appendChild(ta);

      const sticker = document.createElement('div');
      sticker.className = 'cell-sticker';
      sticker.innerHTML = stickerHTML();
      cell.appendChild(sticker);

      const tap = document.createElement('div');
      tap.className = 'tap-zone';
      tap.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!state.cells[i].trim()) return;
        state.done[i] = !state.done[i];
        cell.classList.toggle('done', state.done[i]);
        updateBingoBanner();
        markUnsaved();
      });
      cell.appendChild(tap);

      grid.appendChild(cell);
    }
    updateBingoBanner();
  }

  function updateBingoBanner() {
    const allDone = state.done.every(Boolean) && state.cells.every(c => c.trim());
    bingoBanner.classList.toggle('show', allDone);
  }

  rewardInput.value = state.reward || '';
  notesInput.value = state.notes || '';
  rewardInput.addEventListener('input', () => { state.reward = rewardInput.value; markUnsaved(); });
  notesInput.addEventListener('input', () => { state.notes = notesInput.value; markUnsaved(); });

  function renderStars() {
    starsEl.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const s = document.createElement('div');
      s.className = 'star-btn' + (i <= state.rating ? ' on' : '');
      s.addEventListener('click', () => { state.rating = i; renderStars(); markUnsaved(); });
      starsEl.appendChild(s);
    }
    ratingCaption.textContent = state.rating ? `Оценка недели: ${state.rating} из 10` : 'Оцени неделю от 1 до 10';
  }

  function markUnsaved() {
    saveBtn.classList.remove('saved');
    saveBtn.textContent = 'Сохранить карту';
    statusEl.textContent = '';
  }

  saveBtn.addEventListener('click', () => {
    const payload = JSON.stringify({
      cells: state.cells, done: state.done,
      reward: state.reward, rating: state.rating, notes: state.notes
    });
    if (tg && tg.sendData) {
      tg.sendData(payload);
      saveBtn.classList.add('saved');
      saveBtn.textContent = 'Сохранено ✓';
      statusEl.textContent = 'Карта отправлена боту';
      setTimeout(() => { if (tg.close) tg.close(); }, 700);
    } else {
      statusEl.textContent = 'Открыто вне Telegram — данные не отправлены.';
      console.log('board payload', payload);
    }
  });

  document.getElementById('mascotHeaderLeft').innerHTML = mascotSVG('star', 'happy');
  document.getElementById('mascotHeaderRight').innerHTML = mascotSVG('heart', 'happy');
  document.getElementById('mascotQuests').innerHTML = mascotSVG('cat-purple', 'wink');
  document.getElementById('mascotReward').innerHTML = mascotSVG('cat-lime', 'silly');
  document.getElementById('mascotResults').innerHTML = mascotSVG('cat-orange', 'sleepy');

  renderGrid();
  renderStars();
})();
</script>
</body>
</html>
