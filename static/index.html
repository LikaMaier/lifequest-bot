<!doctype html>
<html lang="ru" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FDF7DE">
<title>LifeQuest</title>
<link rel="preload" href="assets/fonts/unbounded-cyrillic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/nunito-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/themes.css">
<script src="assets/js/vendor/telegram-web-app.js"></script>
<script>
// Если приложение не загрузилось — сообщаем админу (POST /client-error), один раз на вид сбоя.
(function () {
  var sent = {};
  window.lqReport = function (kind, detail) {
    if (sent[kind]) return;
    sent[kind] = 1;
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      var hp = new URLSearchParams(location.hash.slice(1));  // если скрипт Telegram не загрузился
      fetch('client-error', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: kind, detail: String(detail || '').slice(0, 300),
          initData: (tg && tg.initData) || hp.get('tgWebAppData') || '',
          platform: (tg && tg.platform) || hp.get('tgWebAppPlatform') || '',
          version: (tg && tg.version) || hp.get('tgWebAppVersion') || '' }) }).catch(function () {});
    } catch (e) { /* не мешаем странице */ }
  };
  setTimeout(function () { if (!window.lqBooted) window.lqReport('slow'); }, 15000);
  window.addEventListener('error', function (e) {
    if (!window.lqBooted) window.lqReport('js_error', (e.message || '') + ' ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!window.lqBooted) window.lqReport('js_error', String((e.reason && e.reason.message) || e.reason));
  });
})();
</script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Для LifeQuest нужен включённый JavaScript.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
